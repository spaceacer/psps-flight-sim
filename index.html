<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Modular Flight Sim</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: monospace; }
        canvas { display: block; }
        
        #hud {
            position: absolute; top: 20px; left: 20px;
            color: white; background: rgba(0, 0, 0, 0.7);
            padding: 15px; border-radius: 8px; font-size: 16px;
            pointer-events: none; display: flex; gap: 15px; align-items: center;
        }

        .stats { display: flex; flex-direction: column; gap: 5px; margin-right: 10px; }

        /* Standard Gauge Size */
        .gauge {
            width: 80px; height: 80px;
            border-radius: 50%; border: 3px solid #555;
            position: relative; overflow: hidden; background: #222;
        }

        /* 1. Attitude Indicator */
        #attitude-indicator { background: #654321; }
        #sky { width: 200%; height: 200%; background: #2196F3; position: absolute; bottom: 50%; left: -50%; transform-origin: bottom center; }
        #plane-symbol { width: 40px; height: 2px; background: yellow; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 2px black; }

        /* 2. Heading Indicator (Compass) */
        #compass-ring { width: 100%; height: 100%; position: absolute; }
        #compass-ring span { position: absolute; font-size: 12px; font-weight: bold; }
        #compass-ring .n { top: 2px; left: 50%; transform: translateX(-50%); }
        #compass-ring .e { top: 50%; right: 2px; transform: translateY(-50%); }
        #compass-ring .s { bottom: 2px; left: 50%; transform: translateX(-50%); }
        #compass-ring .w { top: 50%; left: 2px; transform: translateY(-50%); }
        #heading-bug { position: absolute; top: 0; left: 50%; transform: translateX(-50%); color: yellow; font-size: 14px; z-index: 2; }

        /* 3. Turn Coordinator */
        #tc-plane { width: 40px; height: 4px; background: white; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        #tc-plane::after { content: ''; position: absolute; top: -10px; left: 18px; width: 4px; height: 10px; background: white; } 
    </style>
</head>
<body>
    <div id="hud">
        <div class="stats">
            <div>THR: <span id="ui-throttle">0</span>%</div>
            <div>SPD: <span id="ui-speed">0</span> kts</div>
            <div>ALT: <span id="ui-alt">0</span> ft</div>
            <div>TRM: <span id="ui-trim">0</span></div> </div>
        </div>
        
        <div class="gauge" id="attitude-indicator">
            <div id="sky"></div>
            <div id="plane-symbol"></div>
        </div>

        <div class="gauge" id="heading-indicator">
            <div id="heading-bug">▼</div>
            <div id="compass-ring">
                <span class="n">N</span><span class="e">E</span><span class="s">S</span><span class="w">W</span>
            </div>
        </div>

        <div class="gauge" id="turn-coordinator">
            <div id="tc-plane"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script type="module" src="game.js"></script>
</body>
</html>
